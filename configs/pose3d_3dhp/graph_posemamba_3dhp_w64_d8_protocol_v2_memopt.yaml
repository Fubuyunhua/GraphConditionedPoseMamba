mpi3dhp_checkpoint_selection: final_epoch
sample_stride: 1
num_joints: 17
rootrel: true
no_conf: false
gt_2d: false
train_2d: false
pretrain_3d_curriculum: 0

no_eval: false
finetune: false
partial_train: null
lambda_3d: 1.0
