# GraphConditionedPoseMamba W64/D8 — repaired MPI-INF-3DHP protocol.
config: configs/pose3d_3dhp/graph_posemamba_3dhp_w64_d8_protocol_v2_memopt.yaml
checkpoint: runs/graph_posemamba/3dhp/w64_d8_protocol_v2_seed0
pretrained: runs/graph_posemamba/3dhp/w64_d8_protocol_v2_seed0
resume: ''
evaluate: ''
selection: latest_epoch.bin
seed: 0

# PoseMamba MPI-INF-3DHP schedule.
epochs: 120
warmup_epochs: 8
batch_size: 4
test_batch_size: 4
learning_rate: 0.0002
weight_decay: 0.01
lr_decay: 0.99
checkpoint_frequency: 30
use_ema: true
ema_decay: 0.9998

backbone: GraphConditionedPoseMamba
model_type: GraphConditionedPoseMamba
maxlen: 81
dim_feat: 64
depth: 8
mlp_ratio: 1.96875
ssm_d_state: 16
ssm_ratio: 1.875
dropout: 0.0
drop_path_rate: 0.2
use_graph_mixer: true
use_symmetry_edges: true
graph_hidden_ratio: 0.5
graph_conditioned_ssm: true
reuse_graph_context: true
factorized_spatial_temporal: true
spatial_ssm_conv: 1
temporal_ssm_conv: 3
graph_scale: 1.0
spatial_res_scale: 1.0
temporal_res_scale: 1.0

compile_model: true
compile_mode: default
compile_compatible_scan: true
cuda_graph_model: false
eager_eval_when_compiled: true
activation_checkpoint_blocks: false
allow_tf32: false

# Authoritative unclipped RTX5090 data reused by symlink.
