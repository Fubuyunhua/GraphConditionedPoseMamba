name: Portable release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  configs-and-counters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install PyYAML
      - run: python tests/test_gcspose_release.py
      - run: python tests/test_complexity_conventions.py
